<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unity Data Package Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <h1>Unity Data Package Generator</h1>
      <form id="dataForm">
        <label for="imageInput">Upload Image:</label>
        <input type="file" id="imageInput" accept="image/*" /><br /><br />

        <label for="stringInput1">Custom String 1:</label>
        <input
          type="text"
          id="stringInput1"
          placeholder="Enter string 1"
        /><br /><br />

        <label for="stringInput2">Custom String 2:</label>
        <input
          type="text"
          id="stringInput2"
          placeholder="Enter string 2"
        /><br /><br />

        <button type="button" id="saveButton">Save</button>
      </form>

      <h2>Output</h2>
      <pre id="output"></pre>
      <p id="size"></p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
